<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Quiz Socket Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>

<body>
    <h2>Quiz Socket Test</h2>

    <!-- Login Section -->
    <div>
        <h3>Login</h3>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">Login</button>
        <p id="loginStatus"></p>
    </div>

    <!-- Join Quiz Section -->
    <div>
        <h3>Join Quiz</h3>
        <input type="text" id="joinCode" placeholder="Enter Quiz Join Code">
        <button onclick="joinQuiz()">Join Quiz</button>
        <p id="quizStatus"></p>
    </div>

    <!-- Submit Answer Section -->
    <div>
        <h3>Submit Answer</h3>
        <input type="text" id="sessionId" placeholder="Session ID">
        <input type="text" id="questionId" placeholder="Question ID">
        <input type="text" id="response" placeholder="Answer">
        <button onclick="submitAnswer()">Submit Answer</button>
        <p id="answerStatus"></p>
    </div>

    <script>
        let isLoggedIn = false;
        let socket = null;

        // Replace with your backend API URL for login
        const API_URL = 'http://localhost:7777';

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_URL}/v1/auth/sessions`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    isLoggedIn = true;
                    document.getElementById('loginStatus').innerText = 'Login successful!';
                } else {
                    document.getElementById('loginStatus').innerText = data.message || 'Login failed';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('loginStatus').innerText = 'Login error';
            }
        }

        function joinQuiz() {
            if (!isLoggedIn) {
                alert('Please login first');
                return;
            }

            const joinCode = document.getElementById('joinCode').value;

            // The backend authenticates Socket.IO with the signed login cookie.
            socket = io('http://localhost:7777', {
                withCredentials: true
            });

            socket.on('connect', () => {
                console.log('Connected to server via socket');
                socket.emit('joinSession', { sessionId: joinCode });
            });

            socket.on('quiz_started', (data) => {
                console.log('Quiz started:', data);
                document.getElementById('quizStatus').innerText = 'Quiz started!';
            });

            socket.on('session_ended', (data) => {
                console.log('Quiz ended:', data);
                document.getElementById('quizStatus').innerText = 'Quiz ended!';
            });

            socket.on('live_answer_submitted', (data) => {
                console.log('New answer submitted:', data);
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from server');
            });
        }

        async function submitAnswer() {
            if (!socket || !isLoggedIn) {
                alert('Join quiz first');
                return;
            }

            const sessionId = document.getElementById('sessionId').value;
            const questionId = document.getElementById('questionId').value;
            const response = document.getElementById('response').value;

            socket.emit('submitAnswer', { sessionId, questionId, response, timeTakenSecs: 0 }, (data) => {
                if (data?.success) {
                    document.getElementById('answerStatus').innerText = 'Answer submitted!';
                    console.log('Answer submitted:', data);
                } else {
                    document.getElementById('answerStatus').innerText = data?.error || 'Submission failed';
                }
            });
        }
    </script>
</body>

</html>
